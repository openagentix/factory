# Source of truth for repository labels. Apply with: gh label create "<name>" --color <color> --description "<text>" --force
- name: "kind/bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "kind/feature"
  color: "a2eeef"
  description: "New capability or improvement"
- name: "kind/design"
  color: "5319e7"
  description: "Needs or is a design decision (a decision record)"
- name: "kind/docs"
  color: "0075ca"
  description: "Documentation only"
- name: "kind/test"
  color: "fbca04"
  description: "Tests, test tooling or test coverage"
- name: "kind/chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, dependencies, repository hygiene"
- name: "kind/security-hardening"
  color: "b60205"
  description: "Non-sensitive hardening; vulnerabilities go to private reporting"
- name: "area/api"
  color: "1d76db"
  description: "Shared types, parsing, validation (internal/api)"
- name: "area/store"
  color: "1d76db"
  description: "Run records, dial settings, SQLite"
- name: "area/githost"
  color: "1d76db"
  description: "Git host interface and the GitHub implementation"
- name: "area/runner"
  color: "1d76db"
  description: "Where a run executes: local process, later container and Kubernetes"
- name: "area/harness"
  color: "1d76db"
  description: "Adapters for Claude Code, Codex and the stub"
- name: "area/verify"
  color: "1d76db"
  description: "Diff, protected paths, checks, risk, evidence bundle"
- name: "area/orchestrator"
  color: "1d76db"
  description: "Triggers, the autonomy dial, throttles, claims"
- name: "area/copilot"
  color: "1d76db"
  description: "The co-pilot endpoint and plugins"
- name: "area/server"
  color: "1d76db"
  description: "JSON API and server-sent events"
- name: "area/web"
  color: "1d76db"
  description: "The web app"
- name: "area/docs"
  color: "1d76db"
  description: "Documentation"
- name: "area/ci"
  color: "1d76db"
  description: "CI, release and supply chain"
- name: "area/community"
  color: "1d76db"
  description: "Contributor experience, process, governance"
- name: "priority/p0"
  color: "b60205"
  description: "Blocks the current release or adoption"
- name: "priority/p1"
  color: "d93f0b"
  description: "Planned for the milestone"
- name: "priority/p2"
  color: "fef2c0"
  description: "Useful, can wait"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers: small, self-contained, with pointers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed; open to outside contributors"
- name: "status/needs-triage"
  color: "ededed"
  description: "A maintainer has not looked at this yet"
- name: "status/needs-design"
  color: "c5def5"
  description: "Needs a design decision before work starts"
- name: "status/blocked"
  color: "000000"
  description: "Waiting on something else"
- name: "status/accepted"
  color: "0e8a16"
  description: "Accepted by a maintainer; ready to be worked on"
- name: "adapter"
  color: "bfd4f2"
  description: "A place where an outside contributor can add an integration"
- name: "factory:goal"
  color: "0e8a16"
  description: "A business goal the factory turns into a spec and tickets"
- name: "factory:planned"
  color: "c2e0c6"
  description: "A ticket made from a spec, waiting for its dependencies"
- name: "factory:ready"
  color: "1d76db"
  description: "A ticket ready to be worked on"
- name: "factory:claimed"
  color: "fbca04"
  description: "A run or a person has claimed this ticket"
- name: "factory:agent"
  color: "5319e7"
  description: "Opened or changed by a factory run"
- name: "factory:needs-human"
  color: "d93f0b"
  description: "A person must answer, decide or review before this moves"
