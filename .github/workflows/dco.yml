name: dco

# Developer Certificate of Origin check. Every commit in a pull request needs a "Signed-off-by" line whose address
# matches the commit's author. See CONTRIBUTING.md.
# Plain shell over `git log`; no third-party action except checkout (pinned by commit SHA).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Rule: a non-merge commit passes with a Signed-off-by line whose address matches the author address.
        # A merge commit and a commit by a bot account (author name ends in "[bot]") pass.
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_name=$(git log -1 --format='%an' "$c")
            author_email=$(git log -1 --format='%ae' "$c")
            case "$author_name" in *"[bot]") continue ;; esac
            if git log -1 --format='%B' "$c" | grep -iqF "Signed-off-by: " &&
               git log -1 --format='%B' "$c" | grep -i '^Signed-off-by: ' | grep -iqF "<$author_email>"; then
              continue
            fi
            echo "Missing or mismatched Signed-off-by: $(git log -1 --format='%h %s' "$c")"
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Fix with: git commit --amend -s --no-edit   (or: git rebase --signoff $BASE)"
            exit 1
          fi
          echo "All commits are signed off."
